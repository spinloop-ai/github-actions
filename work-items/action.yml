name: work-items
description: >-
  Turn GitHub issue events into orchestrator work items: an issue opened adds
  an item to the work items file, a closed issue removes it — the file the
  orchestrator works, worked in the caller's repo and, where it is on,
  committed and pushed with the workflow's token.

inputs:
  event:
    description: The issue event to work — opened (adds an item) or closed (removes one)
    default: ${{ github.event.action }}
  items:
    description: The work items file, relative to the repo root
    default: work.yaml
  id:
    description: The item's id; defaults to the issue's number
    default: ${{ github.event.issue.number }}
  template:
    description: >-
      The item's instructions, rendered against the issue with {{.Title}},
      {{.Body}}, {{.Number}}, {{.URL}} and {{.Labels}}
    default: "{{.Title}}\n\n{{.Body}}"
  dir:
    description: The directory the item's agent works in, on the machine the orchestrator runs
    default: .
  tags:
    description: The item's tags, comma-separated key=value pairs binding it to a kind of node
    default: ""
  priority:
    description: The item's priority, higher first
    default: "0"
  labels:
    description: >-
      The labels an issue must carry, one of them, to become work,
      comma-separated; where none are named, every issue does
    default: ""
  version:
    description: The spinloop release to work with — latest, or a tag such as v1.40.0
    default: latest
  binary:
    description: >-
      A spinloop binary to work with instead of downloading a release; the
      version input is ignored where it is set
    default: ""
  push:
    description: "Commit and push the worked items file with the workflow's token — true, or false to leave committing to the caller"
    default: "true"
  issue-title:
    description: The issue's title; defaulted from the event, named for a workflow that works an issue the event does not carry
    default: ${{ github.event.issue.title }}
  issue-body:
    description: The issue's body; defaulted from the event, named for a workflow that works an issue the event does not carry
    default: ${{ github.event.issue.body }}
  issue-number:
    description: The issue's number; defaulted from the event, named for a workflow that works an issue the event does not carry
    default: ${{ github.event.issue.number }}
  issue-url:
    description: The issue's URL; defaulted from the event, named for a workflow that works an issue the event does not carry
    default: ${{ github.event.issue.html_url }}
  issue-labels:
    description: The issue's labels, comma-separated; defaulted from the event, named for a workflow that works an issue the event does not carry
    default: ${{ join(github.event.issue.labels.*.name, ',') }}

runs:
  using: composite
  steps:
    - id: spinloop
      name: Resolve spinloop
      shell: bash
      env:
        BINARY: ${{ inputs.binary }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        if [ -n "$BINARY" ]; then
          if [ ! -x "$BINARY" ]; then
            echo "the binary input names $BINARY, which is not an executable file: point it at a built spinloop" >&2
            exit 1
          fi
          BIN="$BINARY"
        else
          if [ "$VERSION" = "latest" ]; then
            TAG="$(node -e 'const h={headers:{}};if(process.env.GITHUB_TOKEN)h.headers.authorization="Bearer "+process.env.GITHUB_TOKEN;fetch("https://api.github.com/repos/spinloop-ai/spinloop/releases/latest",h).then(r=>{if(!r.ok){console.error("looking up the latest spinloop release failed with HTTP "+r.status);process.exit(1)}return r.json()}).then(j=>console.log(j.tag_name))')"
          else
            TAG="$VERSION"
          fi
          case "$TAG" in v*) ;; *) TAG="v$TAG" ;; esac

          case "$RUNNER_OS" in
            Linux) OS=linux ;;
            macOS) OS=darwin ;;
            Windows) OS=windows ;;
            *) echo "the runner's operating system $RUNNER_OS has no spinloop release asset" >&2; exit 1 ;;
          esac
          case "$RUNNER_ARCH" in
            X64) ARCH=amd64 ;;
            ARM64) ARCH=arm64 ;;
            *) echo "the runner's architecture $RUNNER_ARCH has no spinloop release asset: use an x64 or arm64 runner" >&2; exit 1 ;;
          esac
          case "$OS" in
            windows) EXT=zip ;;
            *) EXT=tar.gz ;;
          esac

          ASSET="spinloop_${OS}_${ARCH}.${EXT}"
          URL="https://github.com/spinloop-ai/spinloop/releases/download/${TAG}/${ASSET}"
          echo "downloading spinloop $TAG ($ASSET)"
          DIR="$(mktemp -d)"
          curl -fSL "$URL" -o "$DIR/$ASSET"
          tar -xf "$DIR/$ASSET" -C "$DIR"
          BIN="$(find "$DIR" -type f \( -name spinloop -o -name spinloop.exe \) | head -n 1)"
          if [ -z "$BIN" ]; then
            echo "no spinloop binary in $ASSET for $TAG" >&2
            exit 1
          fi
          chmod +x "$BIN"
        fi

        if ! "$BIN" work --help >/dev/null 2>&1; then
          echo "the spinloop at $BIN has no work command: pin version to a release that carries the work command family" >&2
          exit 1
        fi
        echo "bin=$BIN" >> "$GITHUB_OUTPUT"

    - id: work
      name: Work the items file
      shell: bash
      env:
        BIN: ${{ steps.spinloop.outputs.bin }}
        EVENT: ${{ inputs.event }}
        ITEMS: ${{ inputs.items }}
        ID: ${{ inputs.id }}
        TEMPLATE: ${{ inputs.template }}
        DIR: ${{ inputs.dir }}
        TAGS: ${{ inputs.tags }}
        PRIORITY: ${{ inputs.priority }}
        LABELS: ${{ inputs.labels }}
        ISSUE_TITLE: ${{ inputs.issue-title }}
        ISSUE_BODY: ${{ inputs.issue-body }}
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        ISSUE_URL: ${{ inputs.issue-url }}
        ISSUE_LABELS: ${{ inputs.issue-labels }}
      run: |
        set -euo pipefail

        case "$EVENT" in
          opened|closed) ;;
          *) echo "event $EVENT is not one the action works: it works opened (adds an item) and closed (removes one)" >&2; exit 1 ;;
        esac

        INDIR="$(mktemp)"
        export INDIR
        GATE="$(node "${{ github.action_path }}/lib/render.js")"
        case "$GATE" in
          SKIP:*)
            echo "$GATE"
            exit 0
            ;;
          GO) ;;
          *) echo "the render step said $GATE, which is neither GO nor SKIP" >&2; exit 1 ;;
        esac

        INSTR="$(cat "$INDIR")"

        TAG_ARGS=()
        if [ -n "$TAGS" ]; then
          while IFS= read -r t || [ -n "$t" ]; do
            t="$(printf '%s' "$t" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            if [ -n "$t" ]; then TAG_ARGS+=("--tag" "$t"); fi
          done < <(printf '%s' "$TAGS" | tr ',' '\n')
        fi

        MSG=""
        case "$EVENT" in
          opened)
            ADD_ARGS=(work add --items "$ITEMS" --id "$ID" --instructions "$INSTR" --dir "$DIR")
            if [ -n "$PRIORITY" ]; then ADD_ARGS+=(--priority "$PRIORITY"); fi
            if [ ${#TAG_ARGS[@]} -gt 0 ]; then ADD_ARGS+=("${TAG_ARGS[@]}"); fi
            set +e
            OUT="$( "$BIN" "${ADD_ARGS[@]}" 2>&1 )"; RC=$?
            set -e
            if [ "$RC" -ne 0 ]; then
              case "$OUT" in
                *"already carries an item with id"*)
                  echo "item $ID is already in $ITEMS: nothing to add, the file is untouched"
                  exit 0
                  ;;
                *) printf '%s\n' "$OUT" >&2; exit "$RC" ;;
              esac
            fi
            printf '%s\n' "$OUT"
            MSG="add item $ID (issue #$ISSUE_NUMBER)"
            ;;
          closed)
            set +e
            OUT="$( "$BIN" work remove "$ID" --items "$ITEMS" 2>&1 )"; RC=$?
            set -e
            if [ "$RC" -ne 0 ]; then
              case "$OUT" in
                *"carries no item with id"*)
                  echo "item $ID is not in $ITEMS: nothing to remove, the file is untouched"
                  exit 0
                  ;;
                *) printf '%s\n' "$OUT" >&2; exit "$RC" ;;
              esac
            fi
            printf '%s\n' "$OUT"
            MSG="remove item $ID (issue #$ISSUE_NUMBER)"
            ;;
        esac
        echo "msg=$MSG" >> "$GITHUB_OUTPUT"

    - id: commit
      name: Commit and push
      shell: bash
      env:
        ITEMS: ${{ inputs.items }}
        PUSH: ${{ inputs.push }}
        MSG: ${{ steps.work.outputs.msg }}
      run: |
        set -euo pipefail

        if [ "$PUSH" != "true" ]; then
          echo "push is off: the items file is worked, but committing and pushing is left to the caller"
          exit 0
        fi

        if git status --porcelain -- "$ITEMS" | grep -q .; then
          git add -- "$ITEMS"
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "$MSG"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "committed and pushed the updated $ITEMS"
        else
          echo "the items file is unchanged: nothing to commit"
        fi
